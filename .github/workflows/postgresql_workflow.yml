name: Run PostgreSQL Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd="pg_isready -U postgres -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h postgres -U postgres -d test_db; do
            echo "Esperando a PostgreSQL..."
            sleep 2
          done

      - name: Set up database schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h postgres -U postgres -d test_db -f 01_create_tables.sql

      - name: Import CSV into table
        env:
          PGPASSWORD: postgres
        run: |
          psql -h postgres -U postgres -d test_db -v ON_ERROR_STOP=1 -c "\copy datos (id,categoria,valor,fecha) FROM 'datos_agregacion_transformacion.csv' WITH (FORMAT csv, HEADER true)"

      - name: Query data (sum + transpose)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h postgres -U postgres -d test_db -f 02_query_data.sql
